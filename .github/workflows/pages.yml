# Publica el sitio en GitHub Pages en cada push a master.
# El sitio vive en /elizabeth-creations/, por eso el build lleva --base.
# Además de la landing (y sus variantes), copia la galería de anuncios y los
# reels de docs/ para poder compartirlos con el mismo link.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/elizabeth-creations/
      - name: Galería de anuncios y reels
        run: |
          mkdir -p dist/docs/motion
          rsync -a --exclude _fuente --exclude render.mjs docs/galeria dist/docs/
          cp docs/motion/*.mp4 docs/motion/*-poster.jpg dist/docs/motion/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
