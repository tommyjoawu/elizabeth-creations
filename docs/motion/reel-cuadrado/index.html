<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #FBF1E1; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Recorte cuadrado del reel de Elizabeth Creations, para la landing: 3 escenas, 10.2 s, en bucle. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.2" data-width="1080" data-height="1080">
      <div id="c1-varita" data-composition-id="c1-varita" data-composition-src="compositions/c1-varita.html" data-start="0" data-duration="3.6" data-track-index="0" data-width="1080" data-height="1080"></div>
      <div id="c2-panama" data-composition-id="c2-panama" data-composition-src="compositions/c2-panama.html" data-start="3.4" data-duration="3.4" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="c3-navidad" data-composition-id="c3-navidad" data-composition-src="compositions/c3-navidad.html" data-start="6.6" data-duration="3.6" data-track-index="2" data-width="1080" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
