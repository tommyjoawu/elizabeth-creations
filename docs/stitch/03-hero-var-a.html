<style>
    /* Papel picado cut-paper / scalloped effect */
    .papel-picado-edge {
      background-image: radial-gradient(circle at 14px 0px, #FFF4E4 14px, transparent 15px);
      background-size: 28px 18px;
      background-repeat: repeat-x;
    }

    /* Hanging strings with subtle natural sway */
    @keyframes sway-subtle-1 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.2deg); }
    }
    @keyframes sway-subtle-2 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-1.4deg); }
    }
    @keyframes sway-subtle-3 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(0.9deg); }
    }
    .sway-1 {
      transform-origin: top center;
      animation: sway-subtle-1 6s ease-in-out infinite;
    }
    .sway-2 {
      transform-origin: top center;
      animation: sway-subtle-2 7.5s ease-in-out infinite;
    }
    .sway-3 {
      transform-origin: top center;
      animation: sway-subtle-3 6.8s ease-in-out infinite;
    }
    
    /* Fine dashed thread pattern */
    .jute-thread {
      background-image: repeating-linear-gradient(to bottom, #2B1238, #2B1238 5px, transparent 5px, transparent 8px);
      width: 1.5px;
    }
  </style>
